name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Environment to deploy after publishing (nonprod | none)'
        required: false
        default: 'nonprod'

permissions:
  id-token: write
  contents: read

env:
  IMAGE_REPO: lettrlabs-publicapi-mcp

jobs:
  publish:
    name: Build + push to ACR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            IMAGE_TAG="${{ github.ref_name }}"
          else
            IMAGE_TAG="sha-${SHORT_SHA}"
          fi
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${IMAGE_TAG}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_NONPROD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_NONPROD }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_NONPROD }}

      - name: Build + push image to ACR
        run: |
          ACR_NAME="${{ vars.AZURE_ACR_NAME }}"
          IMAGE_TAG="${{ steps.tag.outputs.image_tag }}"
          az acr build \
            --registry "$ACR_NAME" \
            --image "${IMAGE_REPO}:${IMAGE_TAG}" \
            --image "${IMAGE_REPO}:latest" \
            --file Dockerfile \
            .

      - name: Summary
        run: |
          echo "### Image published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Registry: \`${{ vars.AZURE_ACR_NAME }}.azurecr.io\`" >> $GITHUB_STEP_SUMMARY
          echo "- Repo: \`${IMAGE_REPO}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: \`${{ steps.tag.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY

  dispatch-deploy:
    name: Dispatch deploy to .Infra repo
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' || github.event.inputs.target_env == 'nonprod'

    steps:
      - name: Fire repository_dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_REPO_DISPATCH_TOKEN }}
          repository: lettrlabs/LettrLabs.PrivateApiMcp.Infra
          event-type: image-published
          client-payload: |-
            {
              "image_tag": "${{ needs.publish.outputs.image_tag }}",
              "source_sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}"
            }
